%% EMQX authorization rules for the weekly broker run. EMQX's shipped acl.conf, except that subscribing to
%% "#" and "+/#" is allowed: the conformance cases subscribe to wildcard filters, and a 3.1 client cannot be
%% told that a subscription was refused. "$SYS/#" stays denied, so the 3.1 authorization case still has an
%% unauthorized topic to probe.
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{deny, all, subscribe, ["$SYS/#"]}.
{allow, {security_profile, legacy}}.
