#
# Builds mqtt-testkit for every supported platform when a GitHub Release is published and
# uploads the archives (plus SHA256SUMS) to that release. The release tag must be v<Cargo.toml version>.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and upload, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  BIN: mqtt-testkit

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match Cargo.toml version $version (expected v$version)"; exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Unit tests (native targets only)
        if: ${{ !contains(matrix.target, 'aarch64-pc-windows') && matrix.target != 'x86_64-apple-darwin' }}
        shell: bash
        run: cargo test --locked --lib --bins --target ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          name="$BIN-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe="$BIN"; [ "${{ matrix.archive }}" = zip ] && exe="$BIN.exe"
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp LICENSE NOTICE README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test
        if: ${{ !contains(matrix.target, 'aarch64-pc-windows') && matrix.target != 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/$BIN"
          "$exe" version
          "$exe" coverage --no-color > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
