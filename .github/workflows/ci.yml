# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  licence-headers:
    # Every source file is Apache-2.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers
        run: |
          missing=$(git ls-files '*.rs' '*.py' '*.sh' '*.yml' '*.toml' | xargs grep -L 'SPDX-License-Identifier: Apache-2.0' || true)
          if [ -n "$missing" ]; then echo "Files without an Apache-2.0 SPDX header:"; echo "$missing"; exit 1; fi
          other=$(git grep -l -I 'SPDX-License-Identifier:' -- . | xargs grep -L 'SPDX-License-Identifier: Apache-2.0' || true)
          if [ -n "$other" ]; then echo "Files with another SPDX licence:"; echo "$other"; exit 1; fi
