[package]
name = "mqtt-testkit"
description = "Conformance and interoperability test kit for MQTT 3.1 / 3.1.1 / 5.0 brokers: requirement-mapped, broker-agnostic."
repository = "https://github.com/OrbitMQ/mqtt-testkit"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
default-run = "mqtt-testkit"

[[bin]]
name = "mqtt-testkit"
path = "src/bin/mqtt-testkit/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
